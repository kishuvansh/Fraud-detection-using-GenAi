# E1 — primary experiment: one-class VAE trained on normal training transactions only.
# Hyperparameters are fixed in advance (PROJECT_PLAN.md §4.2); they are not tuned on labels.

experiment: e1
description: One-class (semi-supervised) VAE trained on normal transactions only

model:
  input_dim: 29            # V1-V28 + log1p(Amount)
  hidden_dims: [64, 32]    # encoder widths; the decoder mirrors them
  latent_dim: 8
  activation: leaky_relu
  logvar_clamp: [-10.0, 10.0]

training:
  batch_size: 512
  learning_rate: 0.001
  weight_decay: 0.0
  max_epochs: 300                # raised from the planned 100: E1 seed-0 validation loss was still falling at epoch 100 (label-free decision, made before any test evaluation)
  early_stopping_patience: 10    # counted only after KL warm-up has finished
  kl_warmup_epochs: 10           # beta rises linearly to its final value over these epochs
  beta: 1.0
  grad_clip_norm: 5.0
  val_noise_seed: 1234           # fixed noise so validation loss is comparable across epochs

seeds: [0, 1, 2, 3, 4]
headline_seed: 0                 # pre-registered model used for figures and the synthetic CSV
device: cpu                      # headline runs on CPU for bitwise reproducibility; "auto" uses CUDA/MPS
deterministic: true

threshold:
  method: validation_percentile  # percentile of anomaly scores on the experiment's validation rows
  percentile: 99.0               # targets ~1% false positives on normal traffic

scores:
  primary: recon_mse             # S1: per-feature MSE of x vs decoder(mu)
  elbo_samples: 10               # S2: negative ELBO averaged over L latent samples
  iwae_samples: 100              # S3: importance-weighted estimate of -log p(x)
  seed: 2024

evaluation:
  sensitivity_percentiles: [90, 95, 97.5, 99, 99.5, 99.9]
  alert_budgets: [100, 500, 1000]
  bootstrap_resamples: 1000
  bootstrap_seed: 7

generation:
  n_samples: null                # null = same as the number of normal test rows (equal-size comparison)
  seed: 0
  temperatures: [1.0, 0.8, 0.5]  # 1.0 is the primary sampler; others are reported for comparison
  c2st_samples: 20000
  dcr_samples: 5000
