# E2 — secondary experiment: fully unsupervised VAE trained on ALL training transactions,
# with labels ignored everywhere (training, early stopping, threshold). Same architecture as E1.

experiment: e2
description: Fully unsupervised VAE trained on all training transactions (labels ignored)

model:
  input_dim: 29
  hidden_dims: [64, 32]
  latent_dim: 8
  activation: leaky_relu
  logvar_clamp: [-10.0, 10.0]

training:
  batch_size: 512
  learning_rate: 0.001
  weight_decay: 0.0
  max_epochs: 300                # raised from the planned 100: E1 seed-0 validation loss was still falling at epoch 100 (label-free decision, made before any test evaluation)
  early_stopping_patience: 10
  kl_warmup_epochs: 10
  beta: 1.0
  grad_clip_norm: 5.0
  val_noise_seed: 1234

seeds: [0, 1, 2, 3, 4]
headline_seed: 0
device: cpu
deterministic: true

threshold:
  method: validation_percentile  # percentile over ALL validation rows (unlabelled)
  percentile: 99.0

scores:
  primary: recon_mse
  elbo_samples: 10
  iwae_samples: 100
  seed: 2024

evaluation:
  sensitivity_percentiles: [90, 95, 97.5, 99, 99.5, 99.9]
  alert_budgets: [100, 500, 1000]
  bootstrap_resamples: 1000
  bootstrap_seed: 7
